name: Fetch exact BROray Stable r20c01 donor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-stable-r20c01.yml

permissions:
  contents: read

jobs:
  fetch-donor:
    if: "${{ github.event.head_commit.message == 'prep: fetch exact Stable r20c01 donor r2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify current Stable donor set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donor
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            'https://api.brovibe.cloud/releases/stable/broray/release.json' \
            -o donor/release.json
          echo 'b87deb3cca0eb01b1632aa8ceb1bcb81de6972bee5b7925e694088cffa9a2ebd  donor/release.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('donor/release.json').read_text())
          raw=Path('donor/release.json').read_text()
          if '3.0.0-r20c01' not in raw:
              raise SystemExit('candidate r20c01 not present in Stable index')
          targets={
            'application':'ad231c899e0a93f90f65489b8b6588aa09ae94b43c1d838e13e4458079c862bd',
            'platform':'eaf2eafb62d1b108fe576d1fda09ae7a5d15ad90f71272abc23f321d397611b0',
            'clean-bootstrap':'fb4943e3d336d091b16e6cf436e2a7eefe7274422246c8038a7eea2e6c0d79a0',
          }
          found={k:[] for k in targets}
          def walk(x):
              if isinstance(x,dict):
                  sha=x.get('sha256')
                  url=x.get('url')
                  if isinstance(sha,str) and isinstance(url,str):
                      for k,v in targets.items():
                          if sha==v: found[k].append(url)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(obj)
          for k,urls in found.items():
              unique=sorted(set(urls))
              if len(unique) != 1:
                  raise SystemExit(f'{k} exact URL resolution failed: {urls!r}')
              Path(f'donor/{k}.url').write_text(unique[0]+'\n')
          PY
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            "$(cat donor/application.url)" -o donor/broray-app-3.0.0-r20c01.tar.gz
          echo 'ad231c899e0a93f90f65489b8b6588aa09ae94b43c1d838e13e4458079c862bd  donor/broray-app-3.0.0-r20c01.tar.gz' | sha256sum -c -
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            "$(cat donor/platform.url)" -o donor/broray-updater-platform-r20.tar.gz
          echo 'eaf2eafb62d1b108fe576d1fda09ae7a5d15ad90f71272abc23f321d397611b0  donor/broray-updater-platform-r20.tar.gz' | sha256sum -c -
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            "$(cat donor/clean-bootstrap.url)" -o donor/broray-clean-bootstrap-r20.bin
          echo 'fb4943e3d336d091b16e6cf436e2a7eefe7274422246c8038a7eea2e6c0d79a0  donor/broray-clean-bootstrap-r20.bin' | sha256sum -c -
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            'https://api.brovibe.cloud/releases/stable/broray/3.0.0-r20/INSTALL-ON-ROUTER.sh' \
            -o donor/INSTALL-ON-ROUTER.sh
          echo '3c3faa352ef78821de791a3e932602b88efadf9b82fecde39c535a67bfbb14c0  donor/INSTALL-ON-ROUTER.sh' | sha256sum -c -
          gzip -t donor/broray-app-3.0.0-r20c01.tar.gz
          gzip -t donor/broray-updater-platform-r20.tar.gz
          file -b donor/broray-clean-bootstrap-r20.bin > donor/clean-bootstrap.filetype.txt
          od -An -tx1 -N32 donor/broray-clean-bootstrap-r20.bin | tr -d ' \n' > donor/clean-bootstrap.magic-32.txt
          printf '\n' >> donor/clean-bootstrap.magic-32.txt
          python3 - <<'PY'
          import json, tarfile, hashlib
          from pathlib import Path, PurePosixPath
          receipt={
            'schemaVersion':2,
            'candidateId':'3.0.0-r20c01',
            'stableRelease':'3.0.0-r20',
            'releaseJsonSha256':'b87deb3cca0eb01b1632aa8ceb1bcb81de6972bee5b7925e694088cffa9a2ebd',
            'installerSha256':'3c3faa352ef78821de791a3e932602b88efadf9b82fecde39c535a67bfbb14c0',
            'objects':{},
            'status':'PASS'
          }
          for name,path in [
              ('application','donor/broray-app-3.0.0-r20c01.tar.gz'),
              ('platform','donor/broray-updater-platform-r20.tar.gz')]:
              p=Path(path)
              with tarfile.open(p,'r:gz') as tf:
                  ms=tf.getmembers()
                  bad=[]
                  for m in ms:
                      q=PurePosixPath(m.name)
                      if q.is_absolute() or '..' in q.parts: bad.append(m.name)
                  if bad: raise SystemExit(f'{name} unsafe members: {bad[:10]}')
                  receipt['objects'][name]={
                    'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                    'sizeBytes':p.stat().st_size,
                    'archiveMembers':len(ms),
                    'regularFiles':sum(m.isfile() for m in ms),
                    'directories':sum(m.isdir() for m in ms),
                    'symlinks':sum(m.issym() for m in ms),
                    'hardlinks':sum(m.islnk() for m in ms),
                    'unsafePaths':0,
                  }
                  Path(f'donor/{name}-members.txt').write_text('\n'.join(m.name for m in ms)+'\n')
          p=Path('donor/broray-clean-bootstrap-r20.bin')
          receipt['objects']['cleanBootstrap']={
            'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'sizeBytes':p.stat().st_size,
            'containerAssumption':'NONE',
            'fileType':Path('donor/clean-bootstrap.filetype.txt').read_text().strip(),
            'magic32Hex':Path('donor/clean-bootstrap.magic-32.txt').read_text().strip(),
          }
          Path('donor/RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum donor/* > donor/SHA256SUMS
      - name: Upload exact donor artifact
        uses: actions/upload-artifact@v4
        with:
          name: broray-stable-r20c01-exact-donor-r2
          path: donor/
          if-no-files-found: error
          retention-days: 7
