name: R0013 selective upstream port regression

on:
  push:
    branches: [codex/r0009-updater-package]
    paths:
      - '.github/workflows/r0013-port-tests.yml'
      - 'packaging/r0013-overlay/**'
      - 'tools/test_r0013*.py'
      - 'tools/test_r0013*.js'
      - 'tools/r0013_inputs.py'
      - 'tools/r0013_platform.py'
      - 'tools/r0013_runtime_paths.py'
      - 'tools/r0013_busybox_fixture.py'
      - 'tools/build_r0013_release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r0013-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq minisign
      - name: BusyBox ash syntax
        run: |
          set -eu
          find packaging/r0013-overlay/app -type f -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in */bin/*|*.sh|*.cgi) busybox ash -n "$file";; esac
            done
      - name: Real Linux process ownership and signal isolation
        run: python3 -B tools/test_r0013_process.py --shell /bin/dash --live-linux
      - name: Subscription rename and rollback transactions
        run: python3 -B tools/test_r0013_subscriptions.py --shell /bin/dash
      - name: Xray catalog and explicit consent
        run: python3 -B tools/test_r0013_xray_selection.py --shell /bin/dash --jq /usr/bin/jq
      - name: Home Xray selector control behavior
        run: node tools/test_r0013_home.js
      - name: Xray rollback identity and operation fence ordering (dash)
        run: sudo python3 -B tools/test_r0013_xray_rollback.py --shell /bin/dash --result /tmp/r0013-xray-rollback-dash.json
      - name: Xray rollback identity and operation fence ordering (BusyBox)
        run: sudo python3 -B tools/test_r0013_xray_rollback.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-xray-rollback-ash.json
      - name: Preserve Xray rollback evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-xray-rollback-${{ github.sha }}
          path: /tmp/r0013-xray-rollback-*.json
          if-no-files-found: ignore
      - name: Compiled application RAM path contract (dash)
        run: sudo python3 -B tools/test_r0013_runtime_paths.py --shell /bin/dash --result /tmp/r0013-runtime-paths-dash.json
      - name: Compiled application RAM path contract (BusyBox)
        run: sudo python3 -B tools/test_r0013_runtime_paths.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-runtime-paths-ash.json
      - name: Preserve compiled runtime path evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-runtime-paths-${{ github.sha }}
          path: /tmp/r0013-runtime-paths-*.json
          if-no-files-found: ignore
      - name: Public version and legacy updater identity separation
        run: |
          python3 -B tools/test_r0013_system_version.py --shell /bin/dash
          node tools/test_r0013_versions.js
      - name: Protected RAM bootstrap and installer ownership
        run: sudo python3 -B tools/test_r0013_bootstrap.py --shell /bin/dash
      - name: Shared RAM namespace and concurrent lock primitive (dash)
        run: sudo python3 -B tools/test_r0013_ram.py --shell /bin/dash --result /tmp/r0013-ram-dash.json
      - name: Shared RAM namespace and concurrent lock primitive (BusyBox ash)
        run: sudo python3 -B tools/test_r0013_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-ram-ash.json
      - name: Preserve primitive test evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-ram-primitive-${{ github.sha }}
          path: /tmp/r0013-ram-*.json
          if-no-files-found: ignore
      - name: Updater RAM transactions (dash, real signatures)
        run: sudo python3 -B tools/test_r0013_updater_ram.py --shell /bin/dash --result /tmp/r0013-updater-dash.json
      - name: Updater RAM transactions (BusyBox ash, real signatures)
        run: sudo python3 -B tools/test_r0013_updater_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-updater-ash.json
      - name: Preserve updater transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-updater-core-${{ github.sha }}
          path: /tmp/r0013-updater-*.json
          if-no-files-found: ignore
      - name: Exact r1 updater child admission (dash)
        run: sudo python3 -B tools/test_r0013_r1_admission.py --shell /bin/dash --result /tmp/r0013-r1-admission-dash.json
      - name: Exact r1 updater child admission (BusyBox applets)
        run: sudo python3 -B tools/test_r0013_r1_admission.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-admission-ash.json
      - name: Preserve exact-r1 admission evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-admission-${{ github.sha }}
          path: /tmp/r0013-r1-admission-*.json
          if-no-files-found: ignore
      - name: Legacy transaction receipt and simulated RAM loss recovery (dash)
        run: sudo python3 -B tools/test_r0013_r1_journal.py --shell /bin/dash --result /tmp/r0013-r1-journal-dash.json
      - name: Legacy transaction receipt and simulated RAM loss recovery (BusyBox)
        run: sudo python3 -B tools/test_r0013_r1_journal.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-journal-ash.json
      - name: Preserve legacy receipt/recovery evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-journal-${{ github.sha }}
          path: /tmp/r0013-r1-journal-*.json
          if-no-files-found: ignore
      - name: Legacy RAM namespace handoff and rollback (dash)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /bin/dash --result /tmp/r0013-r1-ram-dash.json
      - name: Legacy RAM namespace handoff and rollback (BusyBox)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-ram-ash.json
      - name: Preserve RAM handoff evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-ram-${{ github.sha }}
          path: /tmp/r0013-r1-ram-*.json
          if-no-files-found: ignore
      - name: Manifest-bound external platform activation and restore (dash)
        run: sudo python3 -B tools/test_r0013_platform.py --shell /bin/dash --result /tmp/r0013-platform-dash.json
      - name: Manifest-bound external platform activation and restore (BusyBox)
        run: sudo python3 -B tools/test_r0013_platform.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-platform-ash.json
      - name: Preserve external platform transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-platform-${{ github.sha }}
          path: /tmp/r0013-platform-*.json
          if-no-files-found: ignore
      - name: Web config and ownership receipt transaction (dash)
        run: sudo python3 -B tools/test_r0013_web_config.py --shell /bin/dash --result /tmp/r0013-web-config-dash.json
      - name: Web config and ownership receipt transaction (BusyBox)
        run: sudo python3 -B tools/test_r0013_web_config.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-web-config-ash.json
      - name: Preserve web configuration transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-web-config-${{ github.sha }}
          path: /tmp/r0013-web-config-*.json
          if-no-files-found: ignore
  isolated-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install service fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq
      - name: Real S24 and protected RAM publication (dash)
        run: sudo python3 -B tools/test_r0013_service.py --shell /bin/dash --result /tmp/r0013-service-dash.json
      - name: Real S24 and protected RAM publication (BusyBox)
        run: sudo python3 -B tools/test_r0013_service.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-service-ash.json
      - name: Preserve service integration evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-service-${{ github.sha }}
          path: /tmp/r0013-service-*.json
          if-no-files-found: ignore
