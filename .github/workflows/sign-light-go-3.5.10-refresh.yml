name: Sign BROray-Light 3.5.10 Stable refresh manifest
on:
  push:
    branches: [codex/sign-light-go-3.5.10-refresh]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Verify and sign the frozen Go manifest with the existing Light key
        env:
          SIGNING_KEY: ${{ secrets.BRORAY_LIGHT_MINISIGN_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/stable-go-3.5.10-refresh/light-go-release.json
          public_key=.github/stable-go-3.5.10-refresh/light-go-release.pub
          test -n "$SIGNING_KEY" || { echo 'The Light signing secret is unavailable' >&2; exit 1; }
          printf '%s  %s\n' 631cf1b0dca897621909b2a9b88f0872226ae27498e55b57bf5f79a4c0277cc0 "$manifest" b1587b8407f0c0443a361ed29b839319b66912b1b71414bcf31e848c29eab696 "$public_key" | sha256sum -c -
          umask 077
          keydir="$(mktemp -d /dev/shm/light-go-sign.XXXXXX)"
          trap 'rm -f "$keydir/release.key"; rmdir "$keydir"' EXIT
          printf '%s' "$SIGNING_KEY" > "$keydir/release.key"
          unset SIGNING_KEY
          minisign -S -s "$keydir/release.key" -m "$manifest" -t 'BROray-Light Go 3.5.10 Stable' -c 'BROray-Light Stable release signature'
          minisign -V -p "$public_key" -m "$manifest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: light-go-3.5.10-refresh-signed-manifest
          path: |
            .github/stable-go-3.5.10-refresh/light-go-release.json
            .github/stable-go-3.5.10-refresh/light-go-release.json.minisig
          if-no-files-found: error
          retention-days: 7
