name: Fetch exact BROray Stable r14c68 donor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-stable-r14c68.yml

permissions:
  contents: read

jobs:
  fetch-donor:
    if: "${{ github.event.head_commit.message == 'bootstrap: fetch exact Stable r14c68 runtime donor' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify Stable index and application bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p donor
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            'https://api.brovibe.cloud/releases/stable/broray/release.json' \
            -o donor/release.json
          echo '0740557b08c90fe07d51afd3d99d1c6947fdd082cca0c191369af03116995a4c  donor/release.json' | sha256sum -c -
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('donor/release.json')
          obj=json.loads(p.read_text())
          raw=p.read_text()
          if '3.0.0-r14c68' not in raw:
              raise SystemExit('candidate r14c68 not present in Stable index')
          expected='314be910e180d5bbac4677a9483e17f18406c8a4339a849edb2c1c8d7de4e382'
          found=[]
          def walk(x):
              if isinstance(x,dict):
                  if x.get('sha256')==expected and isinstance(x.get('url'),str):
                      found.append(x['url'])
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(obj)
          if len(set(found)) != 1:
              raise SystemExit(f'exact bundle URL resolution failed: {found!r}')
          Path('donor/bundle.url').write_text(found[0]+'\n')
          PY
          BUNDLE_URL="$(cat donor/bundle.url)"
          curl -q --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            -H 'Cache-Control: no-cache, no-store' -H 'Accept-Encoding: identity' \
            "$BUNDLE_URL" -o donor/broray-app-3.0.0-r14c68.tar.gz
          echo '314be910e180d5bbac4677a9483e17f18406c8a4339a849edb2c1c8d7de4e382  donor/broray-app-3.0.0-r14c68.tar.gz' | sha256sum -c -
          gzip -t donor/broray-app-3.0.0-r14c68.tar.gz
          python3 - <<'PY'
          import json, tarfile, hashlib
          from pathlib import Path, PurePosixPath
          a=Path('donor/broray-app-3.0.0-r14c68.tar.gz')
          with tarfile.open(a,'r:gz') as tf:
              ms=tf.getmembers()
              bad=[]
              for m in ms:
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts:
                      bad.append(m.name)
              if bad:
                  raise SystemExit(f'unsafe members: {bad[:10]}')
              receipt={
                'schemaVersion':1,
                'candidateId':'3.0.0-r14c68',
                'stableRelease':'3.0.0-r14',
                'releaseJsonSha256':'0740557b08c90fe07d51afd3d99d1c6947fdd082cca0c191369af03116995a4c',
                'applicationArchiveSha256':hashlib.sha256(a.read_bytes()).hexdigest(),
                'applicationArchiveSizeBytes':a.stat().st_size,
                'archiveMembers':len(ms),
                'regularFiles':sum(m.isfile() for m in ms),
                'directories':sum(m.isdir() for m in ms),
                'symlinks':sum(m.issym() for m in ms),
                'hardlinks':sum(m.islnk() for m in ms),
                'unsafePaths':0,
                'status':'PASS'
              }
          Path('donor/RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum donor/release.json donor/broray-app-3.0.0-r14c68.tar.gz donor/RECEIPT.json > donor/SHA256SUMS
      - name: Upload exact donor artifact
        uses: actions/upload-artifact@v4
        with:
          name: broray-stable-r14c68-exact-donor
          path: donor/
          if-no-files-found: error
          retention-days: 7
