name: R0013 selective upstream port regression

on:
  push:
    branches: [codex/r0009-updater-package]
    paths:
      - '.github/workflows/r0013-port-tests.yml'
      - 'packaging/r0013-overlay/**'
      - 'tools/test_r0013*.py'
      - 'tools/test_r0013*.js'
      - 'tools/check_r0013*.py'
      - 'tools/r0013_inputs.py'
      - 'tools/r0013_platform.py'
      - 'tools/r0013_runtime_paths.py'
      - 'tools/r0013_busybox_fixture.py'
      - 'tools/build_r0013_release.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r0013-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-native-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install native HTTP and CGI fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash jq curl util-linux iproute2
      - name: Native HTTP authentication, sessions and protected CGI (dash)
        run: sudo unshare --mount --net --propagation private python3 -B tools/check_r0013_native_auth.py --shell /bin/dash --result /var/tmp/r0013-native-auth-dash.json
      - name: Native HTTP authentication, sessions and protected CGI (BusyBox)
        run: sudo unshare --mount --net --propagation private python3 -B tools/check_r0013_native_auth.py --shell /usr/bin/busybox --busybox --result /var/tmp/r0013-native-auth-ash.json
      - name: Preserve first native HTTP/session result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-native-auth-${{ github.sha }}
          path: /var/tmp/r0013-native-auth-*.json
          if-no-files-found: ignore
  isolated-prepared-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install prepared app fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq minisign curl util-linux
      - name: Actual prepared daemon idle shutdown (dash)
        run: sudo unshare --net python3 -B tools/check_r0013_daemon_stop.py --shell /bin/dash --result /tmp/r0013-daemon-stop-dash.json
      - name: Actual prepared daemon idle shutdown (BusyBox)
        run: sudo unshare --net python3 -B tools/check_r0013_daemon_stop.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-daemon-stop-ash.json
      - name: Preserve first actual daemon stop result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-daemon-stop-${{ github.sha }}
          path: /tmp/r0013-daemon-stop-*.json
          if-no-files-found: ignore
      - name: Complete prepared app lifecycle without network (dash)
        run: sudo unshare --net python3 -B tools/check_r0013_prepared_app.py --shell /bin/dash --result /tmp/r0013-prepared-app-dash.json
      - name: Complete prepared app lifecycle without network (BusyBox)
        run: sudo unshare --net python3 -B tools/check_r0013_prepared_app.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-prepared-app-ash.json
      - name: Preserve full application lifecycle first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-prepared-app-${{ github.sha }}
          path: /tmp/r0013-prepared-app-*.json
          if-no-files-found: ignore
  isolated-process:
    needs: isolated-live-entry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq minisign
      - name: BusyBox ash syntax
        run: |
          set -eu
          find packaging/r0013-overlay/app -type f -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in */bin/*|*.sh|*.cgi) busybox ash -n "$file";; esac
            done
      - name: Real Linux process ownership and signal isolation
        run: python3 -B tools/test_r0013_process.py --shell /bin/dash --live-linux
      - name: Subscription rename and rollback transactions
        run: python3 -B tools/test_r0013_subscriptions.py --shell /bin/dash
      - name: Xray catalog and explicit consent
        run: python3 -B tools/test_r0013_xray_selection.py --shell /bin/dash --jq /usr/bin/jq
      - name: Preserve canonical ownership across overlapping subscriptions (dash)
        run: python3 -B tools/test_r0013_canonical_owners.py --shell /bin/dash
      - name: Preserve canonical ownership across overlapping subscriptions (BusyBox)
        run: python3 -B tools/test_r0013_canonical_owners.py --shell /usr/bin/busybox --busybox
      - name: Home Xray selector control behavior
        run: node tools/test_r0013_home.js
      - name: Subscription cancel, delete, refresh and error controls
        run: node tools/test_r0013_subscription_controls.js /tmp/r0013-subscription-controls.json
      - name: Current navigation with cache query and fragment
        run: node tools/test_r0013_navigation.js /tmp/r0013-navigation.json
      - name: Preserve subscription control first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-subscription-controls-${{ github.sha }}
          path: |
            /tmp/r0013-subscription-controls.json
            /tmp/r0013-navigation.json
          if-no-files-found: ignore
      - name: Xray rollback identity and operation fence ordering (dash)
        run: sudo python3 -B tools/test_r0013_xray_rollback.py --shell /bin/dash --result /tmp/r0013-xray-rollback-dash.json
      - name: Xray rollback identity and operation fence ordering (BusyBox)
        run: sudo python3 -B tools/test_r0013_xray_rollback.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-xray-rollback-ash.json
      - name: Preserve Xray rollback evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-xray-rollback-${{ github.sha }}
          path: /tmp/r0013-xray-rollback-*.json
          if-no-files-found: ignore
      - name: Compiled application RAM path contract (dash)
        run: sudo python3 -B tools/test_r0013_runtime_paths.py --shell /bin/dash --result /tmp/r0013-runtime-paths-dash.json
      - name: Compiled application RAM path contract (BusyBox)
        run: sudo python3 -B tools/test_r0013_runtime_paths.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-runtime-paths-ash.json
      - name: Preserve compiled runtime path evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-runtime-paths-${{ github.sha }}
          path: /tmp/r0013-runtime-paths-*.json
          if-no-files-found: ignore
      - name: Public version and legacy updater identity separation
        run: |
          python3 -B tools/test_r0013_system_version.py --shell /bin/dash
          node tools/test_r0013_versions.js
      - name: Protected RAM bootstrap and installer ownership
        run: sudo python3 -B tools/test_r0013_bootstrap.py --shell /bin/dash
      - name: Shared RAM namespace and concurrent lock primitive (dash)
        run: sudo python3 -B tools/test_r0013_ram.py --shell /bin/dash --result /tmp/r0013-ram-dash.json
      - name: Shared RAM namespace and concurrent lock primitive (BusyBox ash)
        run: sudo python3 -B tools/test_r0013_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-ram-ash.json
      - name: Preserve primitive test evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-ram-primitive-${{ github.sha }}
          path: /tmp/r0013-ram-*.json
          if-no-files-found: ignore
      - name: Updater RAM transactions (dash, real signatures)
        run: sudo python3 -B tools/test_r0013_updater_ram.py --shell /bin/dash --result /tmp/r0013-updater-dash.json
      - name: Updater RAM transactions (BusyBox ash, real signatures)
        run: sudo python3 -B tools/test_r0013_updater_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-updater-ash.json
      - name: Preserve updater transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-updater-core-${{ github.sha }}
          path: /tmp/r0013-updater-*.json
          if-no-files-found: ignore
      - name: Exact r1 updater child admission (dash)
        run: sudo python3 -B tools/test_r0013_r1_admission.py --shell /bin/dash --result /tmp/r0013-r1-admission-dash.json
      - name: Exact r1 updater child admission (BusyBox applets)
        run: sudo python3 -B tools/test_r0013_r1_admission.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-admission-ash.json
      - name: Preserve exact-r1 admission evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-admission-${{ github.sha }}
          path: /tmp/r0013-r1-admission-*.json
          if-no-files-found: ignore
      - name: Legacy transaction receipt and simulated RAM loss recovery (dash)
        run: sudo python3 -B tools/test_r0013_r1_journal.py --shell /bin/dash --result /tmp/r0013-r1-journal-dash.json
      - name: Legacy transaction receipt and simulated RAM loss recovery (BusyBox)
        run: sudo python3 -B tools/test_r0013_r1_journal.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-journal-ash.json
      - name: Preserve legacy receipt/recovery evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-journal-${{ github.sha }}
          path: /tmp/r0013-r1-journal-*.json
          if-no-files-found: ignore
      - name: Legacy RAM namespace handoff and rollback (dash)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /bin/dash --result /tmp/r0013-r1-ram-dash.json
      - name: Legacy RAM namespace handoff and rollback (BusyBox)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-r1-ram-ash.json
      - name: Preserve RAM handoff evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-r1-ram-${{ github.sha }}
          path: /tmp/r0013-r1-ram-*.json
          if-no-files-found: ignore
      - name: Manifest-bound external platform activation and restore (dash)
        run: sudo python3 -B tools/test_r0013_platform.py --shell /bin/dash --result /tmp/r0013-platform-dash.json
      - name: Manifest-bound external platform activation and restore (BusyBox)
        run: sudo python3 -B tools/test_r0013_platform.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-platform-ash.json
      - name: Preserve external platform transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-platform-${{ github.sha }}
          path: /tmp/r0013-platform-*.json
          if-no-files-found: ignore
      - name: Web config and ownership receipt transaction (dash)
        run: sudo python3 -B tools/test_r0013_web_config.py --shell /bin/dash --result /tmp/r0013-web-config-dash.json
      - name: Web config and ownership receipt transaction (BusyBox)
        run: sudo python3 -B tools/test_r0013_web_config.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-web-config-ash.json
      - name: Preserve web configuration transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-web-config-${{ github.sha }}
          path: /tmp/r0013-web-config-*.json
          if-no-files-found: ignore
  isolated-service:
    needs: isolated-live-entry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install service fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq minisign lighttpd nginx-core
      - name: Real S24 and protected RAM publication (dash)
        run: sudo python3 -B tools/test_r0013_service.py --shell /bin/dash --result /tmp/r0013-service-dash.json
      - name: Real S24 and protected RAM publication (BusyBox)
        run: sudo python3 -B tools/test_r0013_service.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-service-ash.json
      - name: Preserve service integration evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-service-${{ github.sha }}
          path: /tmp/r0013-service-*.json
          if-no-files-found: ignore
      - name: Legacy runtime cross-filesystem RAM handoff (dash)
        run: sudo python3 -B tools/test_r0013_runtime_trees.py --shell /bin/dash --result /tmp/r0013-runtime-trees-dash.json
      - name: Legacy runtime cross-filesystem RAM handoff (BusyBox)
        run: sudo python3 -B tools/test_r0013_runtime_trees.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-runtime-trees-ash.json
      - name: Preserve runtime tree transaction evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-runtime-trees-${{ github.sha }}
          path: /tmp/r0013-runtime-trees-*.json
          if-no-files-found: ignore
  isolated-live-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install live transition fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends busybox dash gcc jq minisign
      - name: Legacy operational status retirement preflight (dash)
        run: sudo python3 -B tools/test_r0013_recovery.py --shell /bin/dash --case finalize --case legacy-status-foreign --case legacy-ready-symlink --result /tmp/r0013-retirement-dash.json
      - name: Preserve first operational retirement result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-retirement-${{ github.sha }}
          path: /tmp/r0013-retirement-*.json
          if-no-files-found: ignore
      - name: Lifecycle completion and early S23 boot (dash)
        run: sudo python3 -B tools/check_r0013_completion.py --shell /bin/dash --result /tmp/r0013-completion-dash.json
      - name: Lifecycle completion and early S23 boot (BusyBox)
        run: sudo python3 -B tools/check_r0013_completion.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-completion-ash.json
      - name: Preserve first lifecycle completion result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-completion-${{ github.sha }}
          path: /tmp/r0013-completion-*.json
          if-no-files-found: ignore
      - name: Fast clean-bootstrap RAM and installed-slot refusal preflight
        run: sudo python3 -B tools/test_r0013_bootstrap.py --shell /bin/dash --result /tmp/r0013-preflight-bootstrap.json
      - name: Fast exact-r1 RAM namespace preflight (dash)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /bin/dash --result /tmp/r0013-preflight-ram-dash.json
      - name: Fast exact-r1 RAM namespace preflight (BusyBox)
        run: sudo python3 -B tools/test_r0013_r1_ram.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-preflight-ram-ash.json
      - name: Preserve early RAM preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-preflight-ram-${{ github.sha }}
          path: /tmp/r0013-preflight-*.json
          if-no-files-found: ignore
      - name: Real r1 and new S24 live transition (dash)
        run: sudo python3 -B tools/test_r0013_live_entry.py --shell /bin/dash --result /tmp/r0013-live-entry-dash.json
      - name: Real r1 and new S24 live transition (BusyBox)
        run: sudo python3 -B tools/test_r0013_live_entry.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-live-entry-ash.json
      - name: Preserve live transition evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-live-entry-${{ github.sha }}
          path: /tmp/r0013-live-entry-*.json
          if-no-files-found: ignore
      - name: Dead legacy owner and boot recovery (dash)
        run: sudo python3 -B tools/test_r0013_recovery.py --shell /bin/dash --result /tmp/r0013-recovery-dash.json
      - name: Dead legacy owner and boot recovery (BusyBox)
        run: sudo python3 -B tools/test_r0013_recovery.py --shell /usr/bin/busybox --busybox --busybox-tools --result /tmp/r0013-recovery-ash.json
      - name: Preserve dead-owner recovery evidence including first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r0013-recovery-${{ github.sha }}
          path: /tmp/r0013-recovery-*.json
          if-no-files-found: ignore
