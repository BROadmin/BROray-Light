<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BROray-Light</title>
<link rel="stylesheet" href="/assets/light.css">
<script defer src="/assets/light.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">BROray<span>–Light</span></a>
  <nav id="navigation" aria-label="Страницы" hidden>
    <a href="/">Главная</a><a href="/servers">Серверы</a><a href="/subscriptions">Подписки</a>
  </nav>
  <button id="logout" type="button" hidden>Выйти</button>
</header>
<main>
  <p id="feedback" role="status" aria-live="polite"></p>
  <section id="login" class="panel" hidden>
    <h1>Вход</h1>
    <form id="login-form">
      <label>Пользователь Keenetic <input name="user" autocomplete="username" required></label>
      <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary">Войти</button>
    </form>
  </section>
  <div id="page"></div>
</main>
</body>
</html>
